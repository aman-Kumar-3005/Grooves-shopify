<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Grooves Care Console</title>
  <link rel="stylesheet" href="/staff/staff.css">
</head>
<body>
  <main class="shell">
    <header><div><span>GROOVES CARE</span><h1>Support console</h1><p>Warranty registrations, claims, returns and service updates.</p></div><button id="logout" type="button" hidden>Lock console</button></header>
    <section class="login" id="login">
      <form id="login-form"><label for="admin-key">Private admin key</label><div><input id="admin-key" type="password" autocomplete="current-password" required><button type="submit">Unlock</button></div><p>The key stays only in this browser tab and is never stored.</p></form>
    </section>
    <section id="workspace" hidden>
      <nav><button type="button" class="active" data-view="tickets">Tickets</button><button type="button" data-view="warranties">Warranties</button><button type="button" data-view="settings">Settings</button><button type="button" id="refresh">Refresh</button></nav>
      <p id="message" role="status" aria-live="polite"></p>
      <div id="content" class="cards"></div>
    </section>
  </main>
  <script src="/staff/staff.js" defer></script>
</body>
</html>
